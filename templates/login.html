<!DOCTYPE html>
{% extends "base.html" %}
{% block title %}Login — AI Leads Tracker{% endblock %}
{% block content %}
  <section style="max-width:520px;margin:0 auto;">
    <h2>Login</h2>
    {% if error %}
      <div class="panel">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}" />
      <div class="form-row">
        <label class="accessible-label" for="email">Email</label>
        <input id="email" type="email" name="email" class="form-input" placeholder="you@example.com" required />
      </div>
      <div class="form-row" style="margin-top:1rem">
        <button type="submit" class="btn">Login with Email</button>
        <a class="oauth-button" href="/auth/google?next={{ next | url_encode }}">Login with Google</a>
      </div>
    </form>
    <p style="margin-top:0.75rem;color:var(--muted);">Use the Google button for a Gmail OAuth login.</p>
  </section>
{% endblock %}
